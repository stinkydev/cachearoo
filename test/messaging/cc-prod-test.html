<html>
<body>
  <script src="/js/de.js"></script>
  <script src="/js/de.msg.competing-consumers.js"></script>
  
  <script>
     var de = new Cachearoo();

     de.connection.onConnect = function() {
       var producer = new Producer(de, 'testing', 8000);
       var start = performance.now();
       for (var i = 0; i < 70; i++) {
         producer.addJob({jobNbr: i})
         .then(function(response) {
           console.log('response!', response, performance.now() - start);
           
         })
         .catch(function(err) {
           console.log('error : ' + JSON.stringify(err));
         });
       }
     };
  </script>
</body>
</html>
