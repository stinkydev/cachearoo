name: Build and test

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]
    
    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Build frontend
      run: |
        cd _admin
        npm install
        
    - name: Build
      run: |
        npm install
        npm run build
      env:
        NODE_OPTIONS: --openssl-legacy-provider --no-experimental-webstorage

    - name: Lint
      run: |
        npm run lint

    - name: Test
      run: |
        npm test
